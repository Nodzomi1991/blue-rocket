<!DOCTYPE html>

<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0e27">
<title>Blue Rocket</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0e27;
    font-family: 'Courier New', monospace;
    color: #e8f4ff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { 
    display: block; 
    width: 100%; 
    height: 100%;
    position: absolute;
    top: 0;
    left: 0;
  }

.screen {
position: fixed;
inset: 0;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 20px;
background: radial-gradient(ellipse at top, #1a2450 0%, #0a0e27 70%);
z-index: 10;
overflow-y: auto;
}
.screen.hidden { display: none; }

h1 {
font-size: clamp(28px, 8vw, 52px);
font-weight: 900;
letter-spacing: 3px;
margin-bottom: 8px;
background: linear-gradient(90deg, #4af2ff 0%, #6b9cff 50%, #b85cff 100%);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
text-align: center;
}

h2 {
font-size: clamp(20px, 5vw, 28px);
color: #4af2ff;
margin-bottom: 20px;
letter-spacing: 2px;
}

button {
padding: 14px 40px;
margin-top: 16px;
background: linear-gradient(135deg, #4af2ff 0%, #6b9cff 100%);
border: none;
border-radius: 12px;
color: #0a0e27;
font-size: 16px;
font-weight: 900;
font-family: inherit;
letter-spacing: 2px;
text-transform: uppercase;
cursor: pointer;
box-shadow: 0 4px 20px rgba(74, 242, 255, 0.4);
transition: transform 0.15s;
}
button:active { transform: scale(0.96); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.subtitle {
color: #8fa8d4;
font-size: 14px;
letter-spacing: 4px;
margin-bottom: 20px;
text-transform: uppercase;
}

#hud {
position: fixed;
top: 0;
left: 0;
right: 0;
padding-top: max(15px, env(safe-area-inset-top));
padding-left: 20px;
padding-right: 20px;
display: flex;
justify-content: space-between;
align-items: flex-start;
pointer-events: none;
z-index: 15;
}
#hud.hidden { display: none; }

.hud-box {
background: rgba(10, 14, 39, 0.7);
border: 1px solid rgba(74, 242, 255, 0.3);
border-radius: 10px;
padding: 8px 14px;
backdrop-filter: blur(8px);
}

.hud-label {
font-size: 10px;
color: #8fa8d4;
letter-spacing: 2px;
text-transform: uppercase;
}

.hud-value {
font-size: 20px;
color: #4af2ff;
font-weight: 900;
letter-spacing: 1px;
}

#powerups {
display: flex;
flex-direction: column;
gap: 8px;
align-items: center;
pointer-events: none;
}

.pwr-indicator {
background: rgba(10, 14, 39, 0.8);
border-radius: 10px;
padding: 6px 12px;
display: flex;
align-items: center;
gap: 8px;
backdrop-filter: blur(8px);
}

.pwr-indicator.hidden { display: none; }

.pwr-indicator#shieldInd {
border: 1px solid rgba(74, 242, 255, 0.6);
box-shadow: 0 0 20px rgba(74, 242, 255, 0.3);
}

.pwr-indicator#boostInd {
border: 1px solid rgba(255, 215, 0, 0.6);
box-shadow: 0 0 20px rgba(255, 215, 0, 0.3);
}

.pwr-icon { font-size: 18px; }

.pwr-bar {
width: 50px;
height: 5px;
background: rgba(255,255,255,0.15);
border-radius: 3px;
overflow: hidden;
}

.pwr-fill {
height: 100%;
width: 100%;
transition: width 0.1s linear;
}

#shieldBar { background: linear-gradient(90deg, #4af2ff, #6b9cff); }
#boostBar { background: linear-gradient(90deg, #ffd700, #ff9500); }

.sound-btn {
padding: 4px 8px !important;
margin: 0 !important;
background: transparent !important;
border: 1px solid rgba(74, 242, 255, 0.3) !important;
border-radius: 8px !important;
font-size: 14px !important;
color: #4af2ff !important;
letter-spacing: 0 !important;
box-shadow: none !important;
min-width: auto !important;
pointer-events: auto;
}

.heart-icon {
font-size: 20px;
filter: drop-shadow(0 0 4px rgba(255, 51, 51, 0.5));
transition: all 0.3s ease;
display: inline-block;
}

.heart-icon.lost {
animation: heartDissapear 0.4s ease-out forwards;
}

@keyframes heartDissapear {
0% { opacity: 1; transform: scale(1) rotate(0deg); }
100% { opacity: 0; transform: scale(0.3) rotate(-180deg); }
}

.loader {
width: 40px; height: 40px;
border: 3px solid rgba(74, 242, 255, 0.2);
border-top-color: #4af2ff;
border-radius: 50%;
animation: spin 0.8s linear infinite;
margin: 20px;
}

@keyframes spin { to { transform: rotate(360deg); } }

.game-over-screen {
text-align: center;
}

.final-score {
font-size: clamp(40px, 12vw, 72px);
font-weight: 900;
background: linear-gradient(90deg, #ffd700, #4af2ff);
-webkit-background-clip: text;
background-clip: text;
color: transparent;
margin: 20px 0;
}

.score-info {
color: #8fa8d4;
font-size: 13px;
margin-bottom: 20px;
letter-spacing: 1px;
}

.timer-display {
color: #ff6b6b;
font-size: 18px;
font-weight: 900;
margin-bottom: 10px;
letter-spacing: 2px;
}

.daily-limit-text {
color: #8fa8d4;
font-size: 12px;
margin-top: 20px;
text-align: center;
max-width: 280px;
line-height: 1.5;
}

.leaderboard-entry {
display: flex;
justify-content: space-between;
align-items: center;
padding: 12px;
background: rgba(74, 242, 255, 0.1);
border: 1px solid rgba(74, 242, 255, 0.2);
border-radius: 8px;
margin-bottom: 8px;
}

.leaderboard-name {
color: #4af2ff;
font-weight: 900;
}

.leaderboard-score {
color: #ffd700;
font-weight: 900;
}

.btn-row {
display: flex;
gap: 12px;
flex-wrap: wrap;
justify-content: center;
margin-top: 20px;
}

.hearts-container {
display: flex;
gap: 8px;
justify-content: center;
margin-bottom: 20px;
}

.heart {
font-size: 28px;
filter: drop-shadow(0 0 4px rgba(255, 51, 51, 0.5));
}

.heart.empty {
opacity: 0.3;
}
</style>

</head>
<body>

<div id="game">
  <canvas id="canvas"></canvas>
</div>

<div id="hud" class="hidden">
  <div class="hud-box">
    <div class="hud-label">Счёт</div>
    <div class="hud-value" id="scoreVal">0</div>
  </div>
  <div id="powerups">
    <div class="pwr-indicator hidden" id="shieldInd">
      <div class="pwr-icon">🛡</div>
      <div class="pwr-bar"><div class="pwr-fill" id="shieldBar"></div></div>
    </div>
    <div class="pwr-indicator hidden" id="boostInd">
      <div class="pwr-icon">⚡</div>
      <div class="pwr-bar"><div class="pwr-fill" id="laserBar"></div></div>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: auto;">
    <button id="soundBtn" class="sound-btn" onclick="toggleSound()">🔊</button>
    <div id="lives-container" style="display: flex; gap: 4px;">
      <span class="heart-icon">❤️</span>
      <span class="heart-icon">❤️</span>
      <span class="heart-icon">❤️</span>
    </div>
  </div>
</div>

<!-- Boot Screen -->

<div id="screen-boot" class="screen">
  <h1>BLUE ROCKET</h1>
  <div class="loader"></div>
  <div class="subtitle">Загрузка...</div>
</div>

<!-- Main Menu -->

<div id="screen-menu" class="screen hidden">
  <h1>BLUE ROCKET</h1>
  <div class="subtitle">◆ Бесконечность ◆</div>
  <div style="margin: 30px 0; text-align: center;">
    <div class="hearts-container" id="heartsDisplay"></div>
    <div class="score-info">Ваш лучший результат</div>
    <div class="final-score" id="bestScore">0</div>
  </div>
  <div class="btn-row">
    <button onclick="startGame()">🎮 ИГРАТЬ</button>
  </div>
  <div class="daily-limit-text">
    ⏱️ Играй максимум 5 минут в день<br>
    🎯 По одной сессии в сутки<br>
    🏆 Призы каждые 2 недели
  </div>
</div>

<!-- Game Over Screen -->

<div id="screen-over" class="screen hidden">
  <div class="game-over-screen">
    <h2>ПОЛЁТ ЗАВЕРШЁН</h2>
    <div class="final-score" id="finalScore">0</div>
    <div class="score-info">🌟 Звёзды × 10 очков</div>
    <div id="newRecord" style="color: #ffd700; font-weight: 900; letter-spacing: 2px; margin-bottom: 10px;"></div>
    <div id="nextPlayTime" class="timer-display" style="display: none;"></div>
    <div class="btn-row">
      <button onclick="showMenu()">← МЕНЮ</button>
      <button onclick="showLeaderboard()">🏆 ЛИДЕРЫ</button>
    </div>
  </div>
</div>

<!-- Leaderboard Screen -->

<div id="screen-leaderboard" class="screen hidden">
  <h2>🏆 ТОП 10 ЛИДЕРОВ 🏆</h2>
  <div id="leaderboard-list" style="width: 100%; max-width: 400px; margin-top: 20px;">
    <div class="loader"></div>
  </div>
  <div class="btn-row" style="margin-top: 30px;">
    <button onclick="showMenu()">← МЕНЮ</button>
  </div>
</div>

<script>
// ==================== FIREBASE CONFIG ====================
const firebaseConfig = {
  apiKey: "AIzaSyC_placeholder",
  authDomain: "blue-rocket-game.firebaseapp.com",
  databaseURL: "https://blue-rocket-game-default-rtdb.firebaseio.com",
  projectId: "blue-rocket-game",
  storageBucket: "blue-rocket-game.appspot.com",
  messagingSenderId: "placeholder",
  appId: "placeholder"
};

// Инициализируем Firebase
let db = null;
let firebaseReady = false;

async function initFirebase() {
  try {
    const script = document.createElement('script');
    script.src = 'https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js';
    script.onload = () => {
      const script2 = document.createElement('script');
      script2.src = 'https://www.gstatic.com/firebasejs/10.0.0/firebase-database.js';
      script2.onload = () => {
        firebase.initializeApp(firebaseConfig);
        db = firebase.database();
        firebaseReady = true;
      };
      document.head.appendChild(script2);
    };
    document.head.appendChild(script);
  } catch (e) {
    console.log('Firebase init failed:', e);
    firebaseReady = false;
  }
}

// ==================== TELEGRAM WEB APP ====================
let tg = null;
let tgUser = null;

function initTelegram() {
  if (typeof window.Telegram !== 'undefined' && window.Telegram.WebApp) {
    tg = window.Telegram.WebApp;
    tg.ready();
    
    // Получаем данные пользователя
    if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
      tgUser = tg.initDataUnsafe.user;
      console.log('Telegram user:', tgUser);
    }
    
    // Настраиваем внешний вид
    tg.setHeaderColor('#0a0e27');
    tg.setBackgroundColor('#0a0e27');
  }
}

initTelegram();
initFirebase();

// ==================== LOCAL STORAGE ====================
const STORAGE_KEY = 'blue_rocket_';

function getSaveKey(suffix) {
  const userId = tgUser ? tgUser.id : 'guest';
  return STORAGE_KEY + userId + '_' + suffix;
}

function saveScore(score) {
  const key = getSaveKey('best_score');
  const current = parseInt(localStorage.getItem(key)) || 0;
  if (score > current) {
    localStorage.setItem(key, score);
  }
  localStorage.setItem(getSaveKey('last_play'), Date.now());
  return score > current;
}

function getBestScore() {
  const key = getSaveKey('best_score');
  return parseInt(localStorage.getItem(key)) || 0;
}

function getLastPlayTime() {
  const key = getSaveKey('last_play');
  return parseInt(localStorage.getItem(key)) || 0;
}

function canPlayToday() {
  const lastPlay = getLastPlayTime();
  if (!lastPlay) return true;
  const now = Date.now();
  const dayInMs = 24 * 60 * 60 * 1000;
  return (now - lastPlay) >= dayInMs;
}

function getTimeUntilNextPlay() {
  const lastPlay = getLastPlayTime();
  if (!lastPlay) return 0;
  const now = Date.now();
  const dayInMs = 24 * 60 * 60 * 1000;
  const nextPlayTime = lastPlay + dayInMs;
  return Math.max(0, nextPlayTime - now);
}

// ==================== UI ====================
function $(id) { return document.getElementById(id); }

function showScreen(name) {
  ['boot', 'menu', 'over', 'leaderboard'].forEach(s => {
    const el = $('screen-' + s);
    if (el) el.classList.toggle('hidden', s !== name);
  });
  
  const canvas = $('canvas');
  const hud = $('hud');
  if (name === 'playing') {
    if (canvas) canvas.style.display = 'block';
    if (hud) hud.classList.remove('hidden');
  } else {
    if (hud) hud.classList.add('hidden');
  }
}

function showMenu() {
  showScreen('menu');
  const best = getBestScore();
  $('bestScore').textContent = best;
  
  // Рисуем сердечки жизней
  const heartsHtml = '❤️ ❤️ ❤️';
  $('heartsDisplay').innerHTML = heartsHtml;
}

async function showGameOver(score) {
  showScreen('over');
  $('finalScore').textContent = score;
  
  const isNewRecord = saveScore(score);
  if (isNewRecord) {
    $('newRecord').textContent = '★ НОВЫЙ РЕКОРД ★';
    // Сохраняем в Firebase
    await uploadScoreToFirebase(score);
  }
  
  // Проверяем лимит игр
  if (!canPlayToday()) {
    const timeLeft = getTimeUntilNextPlay();
    const hours = Math.ceil(timeLeft / (60 * 60 * 1000));
    const el = $('nextPlayTime');
    el.style.display = 'block';
    el.textContent = `⏳ Следующая игра через ${hours}ч`;
  }
}

async function uploadScoreToFirebase(score) {
  if (!firebaseReady || !db || !tgUser) return;
  
  try {
    const userId = tgUser.id;
    const userName = tgUser.first_name || 'Player';
    const timestamp = Date.now();
    
    await db.ref(`leaderboard/${userId}`).set({
      score: score,
      name: userName,
      timestamp: timestamp
    });
  } catch (e) {
    console.log('Firebase upload failed:', e);
  }
}

async function showLeaderboard() {
  showScreen('leaderboard');
  await loadLeaderboard();
}

async function loadLeaderboard() {
  if (!firebaseReady || !db) {
    $('leaderboard-list').innerHTML = '<div style="color: #ff6b6b;">⚠️ Firebase недоступен</div>';
    return;
  }
  
  try {
    const snapshot = await db.ref('leaderboard').once('value');
    const data = snapshot.val();
    
    if (!data) {
      $('leaderboard-list').innerHTML = '<div style="color: #8fa8d4;">Пока нет результатов 🎮</div>';
      return;
    }
    
    const scores = Object.values(data)
      .sort((a, b) => b.score - a.score)
      .slice(0, 10);
    
    let html = '';
    scores.forEach((entry, index) => {
      const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}️⃣`;
      html += `
        <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px; background: rgba(74, 242, 255, 0.1); border: 1px solid rgba(74, 242, 255, 0.2); border-radius: 8px; margin-bottom: 8px;">
          <span style="color: #4af2ff; font-weight: 900;">${medal} ${entry.name}</span>
          <span style="color: #ffd700; font-weight: 900;">${entry.score}</span>
        </div>
      `;
    });
    
    $('leaderboard-list').innerHTML = html;
  } catch (e) {
    console.log('Load leaderboard failed:', e);
    $('leaderboard-list').innerHTML = '<div style="color: #ff6b6b;">⚠️ Ошибка загрузки</div>';
  }
}

// ==================== SOUND ====================
const Sound = {
  ctx: null, enabled: true, masterGain: null, musicNodes: null,
  musicNextTime: 0, musicStep: 0, musicTimer: null,
  
  init() {
    if (this.ctx) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.3;
      this.masterGain.connect(this.ctx.destination);
    } catch (e) { this.enabled = false; }
  },
  
  resume() { 
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); 
  },
  
  beep(freq, dur, type = 'sine', vol = 0.3, slide = 0) {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, now);
    if (slide) osc.frequency.exponentialRampToValueAtTime(Math.max(20, freq + slide), now + dur);
    gain.gain.setValueAtTime(vol, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + dur);
    osc.connect(gain).connect(this.masterGain);
    osc.start(now); osc.stop(now + dur);
  },
  
  collect() { 
    this.beep(880, 0.08, 'square', 0.15); 
    setTimeout(() => this.beep(1320, 0.1, 'square', 0.15), 40); 
  },
  
  shield() { 
    this.beep(440, 0.15, 'sine', 0.25); 
    setTimeout(() => this.beep(660, 0.15, 'sine', 0.25), 80); 
    setTimeout(() => this.beep(880, 0.2, 'sine', 0.25), 160); 
  },
  
  boost() { this.beep(220, 0.3, 'sawtooth', 0.2, 600); },
  
  explode() {
    if (!this.enabled || !this.ctx) return;
    const now = this.ctx.currentTime;
    const bufferSize = this.ctx.sampleRate * 0.5;
    const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / bufferSize, 2);
    const noise = this.ctx.createBufferSource();
    noise.buffer = buffer;
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass'; filter.frequency.value = 800;
    const gain = this.ctx.createGain();
    gain.gain.setValueAtTime(0.5, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
    noise.connect(filter).connect(gain).connect(this.masterGain);
    noise.start(now);
  },
  
  shieldBreak() { this.beep(600, 0.2, 'triangle', 0.25, -400); },
  
  startEngine() {
    if (!this.enabled || !this.ctx || this.musicNodes) return;
    const now = this.ctx.currentTime;
    const rumble = this.ctx.createOscillator();
    rumble.type = 'sawtooth'; rumble.frequency.value = 55;
    const rumbleGain = this.ctx.createGain(); rumbleGain.gain.value = 0.05;
    const rumbleFilter = this.ctx.createBiquadFilter();
    rumbleFilter.type = 'lowpass'; rumbleFilter.frequency.value = 180;
    rumble.connect(rumbleFilter).connect(rumbleGain).connect(this.masterGain);
    rumble.start(now);

    const musicGain = this.ctx.createGain();
    musicGain.gain.value = 0.15;
    musicGain.connect(this.masterGain);

    const scale = [220, 261.63, 293.66, 329.63, 392, 440, 523.25, 587.33, 659.25];
    const pattern = [5,7,8,7, 5,4,5,7, 4,5,7,5, 3,2,3,4, 5,7,8,7, 8,7,5,4, 3,4,5,3, 2,0,2,3];
    const stepDur = 0.28;

    this.musicStep = 0;
    this.musicNextTime = now + 0.1;
    this.musicNodes = { rumble, rumbleGain, musicGain };

    const scheduleMusic = () => {
      if (!this.musicNodes) return;
      const lookAhead = 0.5;
      while (this.musicNextTime < this.ctx.currentTime + lookAhead) {
        const step = this.musicStep;
        const t = this.musicNextTime;
        const noteIdx = pattern[step % pattern.length];
        const freq = scale[noteIdx];
        const mOsc = this.ctx.createOscillator();
        mOsc.type = 'triangle';
        mOsc.frequency.setValueAtTime(freq, t);
        const mGain = this.ctx.createGain();
        mGain.gain.setValueAtTime(0, t);
        mGain.gain.linearRampToValueAtTime(0.5, t + 0.02);
        mGain.gain.exponentialRampToValueAtTime(0.001, t + stepDur * 0.9);
        mOsc.connect(mGain).connect(musicGain);
        mOsc.start(t); mOsc.stop(t + stepDur);
        
        this.musicNextTime += stepDur;
        this.musicStep++;
      }
      this.musicTimer = setTimeout(scheduleMusic, 100);
    };
    scheduleMusic();
  },
  
  stopEngine() {
    if (!this.musicNodes) return;
    if (this.musicTimer) { clearTimeout(this.musicTimer); this.musicTimer = null; }
    try {
      const now = this.ctx.currentTime;
      this.musicNodes.rumbleGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      this.musicNodes.rumble.stop(now + 0.35);
      this.musicNodes.musicGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    } catch (e) {}
    this.musicNodes = null;
  },
  
  toggle() {
    this.enabled = !this.enabled;
    if (!this.enabled) { this.stopEngine(); if (this.masterGain) this.masterGain.gain.value = 0; }
    else if (this.masterGain) this.masterGain.gain.value = 0.3;
    return this.enabled;
  }
};

function toggleSound() {
  Sound.init();
  const on = Sound.toggle();
  $('soundBtn').textContent = on ? '🔊' : '🔇';
  if (on && game && game.running) Sound.startEngine();
}

function vibrate(pattern) {
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch (e) {} }
}

// ==================== GAME ====================
const canvas = $('canvas');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, DPR = 1;

function resizeCanvas() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; 
  H = window.innerHeight;
  canvas.width = W * DPR; 
  canvas.height = H * DPR;
  canvas.style.width = W + 'px'; 
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

let game = null;

function createGame() {
  return {
    running: false, score: 0, time: 0, targetX: W / 2,
    rocket: { x: W / 2, y: H - 140, vx: 0, tilt: 0, width: 36, height: 56, flameT: 0 },
    stars: [], collectibles: [], meteors: [], powerups: [], particles: [], bullets: [],
    spawnTimer: 0, meteorTimer: 0, powerupTimer: 5,
    difficulty: 1, scrollSpeed: 2.5,
    shieldTime: 0, shieldMax: 6,
    boostTime: 0, boostMax: 4,
    laserTime: 0, laserMax: 4,
    shieldRing: 0,
    lives: 3, maxLives: 3,
    lifeBoostUsedThisLevel: false,
    gameStartTime: Date.now(),
    maxDuration: 5 * 60 * 1000, // 5 минут
    
    initBg() {
      for (let i = 0; i < 80; i++) this.stars.push({
        x: Math.random() * W, y: Math.random() * H,
        r: Math.random() * 1.5 + 0.3,
        layer: Math.random() < 0.5 ? 1 : (Math.random() < 0.7 ? 2 : 3),
        tw: Math.random() * Math.PI * 2
      });
    }
  };
}

function pointerMove(e) {
  if (!game || !game.running) return;
  const t = e.touches ? e.touches[0] : e;
  if (!t) return;
  const rect = canvas.getBoundingClientRect();
  game.targetX = t.clientX - rect.left;
  e.preventDefault();
}

canvas.addEventListener('touchstart', pointerMove, { passive: false });
canvas.addEventListener('touchmove', pointerMove, { passive: false });
canvas.addEventListener('mousedown', (e) => { canvas._md = true; pointerMove(e); });
canvas.addEventListener('mousemove', (e) => { if (canvas._md) pointerMove(e); });
canvas.addEventListener('mouseup', () => { canvas._md = false; });
canvas.addEventListener('mouseleave', () => { canvas._md = false; });

function startGame() {
  // Проверяем лимит игр
  if (!canPlayToday()) {
    alert('⏳ Вы уже играли сегодня. Следующая игра будет доступна через 24 часа.');
    return;
  }
  
  resizeCanvas();
  Sound.init(); 
  Sound.resume();
  
  game = createGame();
  game.initBg();
  game.running = true;
  
  showScreen('playing');
  updatePowerupUI();
  Sound.startEngine();
  
  lastFrame = performance.now();
  requestAnimationFrame(loop);
}

window.startGame = startGame;

let lastFrame = 0;
function loop(ts) {
  if (!game || !game.running) {
    requestAnimationFrame(loop);
    return;
  }
  const dt = Math.min(0.05, (ts - lastFrame) / 1000);
  lastFrame = ts;
  update(dt); 
  render();
  requestAnimationFrame(loop);
}

function update(dt) {
  // Проверяем лимит времени
  const elapsed = Date.now() - game.gameStartTime;
  if (elapsed >= game.maxDuration) {
    gameOver();
    return;
  }

  game.time += dt;
  game.difficulty = 1 + game.time * 0.04;
  game.scrollSpeed = 2.5 + game.time * 0.05;

  const effScroll = game.scrollSpeed;

  if (game.shieldTime > 0) {
    game.shieldTime = Math.max(0, game.shieldTime - dt);
    game.shieldRing += dt * 4;
    if (game.shieldTime === 0) { Sound.shieldBreak(); vibrate(20); }
  }

  if (game.laserTime > 0) {
    game.laserTime = Math.max(0, game.laserTime - dt);
    if (Math.random() < 0.6) {
      for (let i = 0; i < 2; i++) {
        game.bullets.push({
          x: game.rocket.x + (Math.random() - 0.5) * 10,
          y: game.rocket.y - 30,
          vy: -8 - Math.random() * 3,
          r: 2.5 + Math.random() * 1.5,
          life: 1.5
        });
      }
    }
  }

  updatePowerupUI();
  updateHearts();

  const r = game.rocket;
  const dx = game.targetX - r.x;
  r.vx += dx * 0.012; r.vx *= 0.85; r.x += r.vx;
  if (r.x < r.width / 2) { r.x = r.width / 2; r.vx = 0; }
  if (r.x > W - r.width / 2) { r.x = W - r.width / 2; r.vx = 0; }
  r.tilt += (r.vx * 0.04 - r.tilt) * 0.2;
  r.tilt = Math.max(-0.5, Math.min(0.5, r.tilt));
  r.flameT += dt * 20;

  game.stars.forEach(s => {
    s.y += effScroll * s.layer * 0.5;
    s.tw += dt * 3;
    if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
  });

  game.spawnTimer -= dt;
  if (game.spawnTimer <= 0) {
    game.spawnTimer = 0.45 + Math.random() * 0.4;
    game.collectibles.push({
      x: 30 + Math.random() * (W - 60), y: -30, r: 14,
      rot: 0, rotSpeed: (Math.random() - 0.5) * 4, pulse: Math.random() * Math.PI * 2
    });
  }

  game.meteorTimer -= dt;
  if (game.meteorTimer <= 0) {
    game.meteorTimer = Math.max(0.35, 1.4 - game.difficulty * 0.12);
    const size = 20 + Math.random() * 22;
    game.meteors.push({
      x: 30 + Math.random() * (W - 60), y: -size, r: size,
      vx: (Math.random() - 0.5) * 1.5,
      vy: 1 + Math.random() * 1.5 + game.difficulty * 0.3,
      rot: Math.random() * Math.PI * 2, 
      rotSpeed: (Math.random() - 0.5) * 2,
      craters: genCraters(size)
    });
  }

  game.powerupTimer -= dt;
  if (game.powerupTimer <= 0) {
    game.powerupTimer = 10 + Math.random() * 8;
    
    let powerupType = 'shield';
    if (!game.lifeBoostUsedThisLevel && Math.random() < 0.33) {
      powerupType = 'life';
      game.lifeBoostUsedThisLevel = true;
    } else if (Math.random() < 0.5) {
      powerupType = 'shield';
    } else {
      powerupType = 'laser';
    }
    
    game.powerups.push({
      x: 40 + Math.random() * (W - 80), y: -30, r: 18,
      type: powerupType,
      rot: 0, pulse: 0
    });
  }

  game.collectibles = game.collectibles.filter(c => {
    c.y += effScroll * 1.5; 
    c.rot += c.rotSpeed * dt; 
    c.pulse += dt * 5;
    if (circHit(c.x, c.y, c.r, r.x, r.y - 10, 20)) {
      game.score += 10;
      spawnBurst(c.x, c.y, '#ffd700', 10); 
      Sound.collect(); 
      return false;
    }
    return c.y < H + 40;
  });

  game.powerups = game.powerups.filter(p => {
    p.y += effScroll * 1.3; 
    p.rot += dt * 2; 
    p.pulse += dt * 4;
    if (circHit(p.x, p.y, p.r, r.x, r.y - 10, 22)) {
      if (p.type === 'shield') {
        game.shieldTime = game.shieldMax;
        spawnBurst(p.x, p.y, '#4af2ff', 20); 
        Sound.shield(); 
        vibrate(30);
      } else if (p.type === 'life') {
        if (game.lives < game.maxLives) {
          game.lives++;
        }
        spawnBurst(p.x, p.y, '#ff4444', 25); 
        Sound.shield(); 
        vibrate(30);
      } else {
        game.laserTime = game.laserMax;
        spawnBurst(p.x, p.y, '#ff4444', 25); 
        Sound.boost(); 
        vibrate(40);
      }
      return false;
    }
    return p.y < H + 40;
  });

  game.bullets = game.bullets.filter(bullet => {
    bullet.y += bullet.vy;
    bullet.life -= dt;
    
    game.meteors = game.meteors.filter(m => {
      if (circHit(bullet.x, bullet.y, bullet.r, m.x, m.y, m.r * 0.8)) {
        game.score += 10;
        spawnBurst(m.x, m.y, '#ff4444', 15);
        Sound.explode();
        return false;
      }
      return true;
    });
    
    return bullet.life > 0 && bullet.y > -50;
  });

  game.meteors = game.meteors.filter(m => {
    m.x += m.vx; 
    m.y += m.vy + effScroll * 0.6; 
    m.rot += m.rotSpeed * dt;
    if (m.x < m.r || m.x > W - m.r) m.vx *= -1;
    if (circHit(m.x, m.y, m.r * 0.85, r.x, r.y, 18)) {
      if (game.shieldTime > 0) {
        game.shieldTime = 0;
        spawnBurst(m.x, m.y, '#4af2ff', 25); 
        spawnBurst(m.x, m.y, '#ffffff', 15);
        Sound.shieldBreak(); 
        vibrate([40, 50, 40]);
        return false;
      }
      game.lives--;
      spawnBurst(r.x, r.y, '#ff6b6b', 20);
      Sound.explode(); 
      vibrate([80, 40, 120]);
      
      if (game.lives <= 0) {
        gameOver();
      }
      return false;
    }
    return m.y < H + 60;
  });

  game.particles = game.particles.filter(p => {
    p.x += p.vx; 
    p.y += p.vy; 
    p.vy += 0.1; 
    p.life -= dt;
    return p.life > 0;
  });

  $('scoreVal').textContent = game.score;
}

function updatePowerupUI() {
  if (!game) return;
  
  const si = $('shieldInd'), bi = $('boostInd');
  if (game.shieldTime > 0) {
    si.classList.remove('hidden');
    $('shieldBar').style.width = (game.shieldTime / game.shieldMax * 100) + '%';
  } else si.classList.add('hidden');
  
  if (game.laserTime > 0) {
    bi.classList.remove('hidden');
    bi.textContent = '';
    bi.innerHTML = '<div class="pwr-icon">🔴</div><div class="pwr-bar"><div class="pwr-fill" id="laserBar"></div></div>';
    $('laserBar').style.width = (game.laserTime / game.laserMax * 100) + '%';
    $('laserBar').style.background = 'linear-gradient(90deg, #ff4444, #ff0000)';
  } else bi.classList.add('hidden');
}

function updateHearts() {
  const hearts = document.querySelectorAll('.heart-icon');
  hearts.forEach((heart, index) => {
    if (index < game.lives) {
      heart.classList.remove('lost');
    } else {
      heart.classList.add('lost');
    }
  });
}

function genCraters(size) {
  const n = 2 + Math.floor(Math.random() * 3);
  const out = [];
  for (let i = 0; i < n; i++) out.push({
    ox: (Math.random() - 0.5) * size * 0.6,
    oy: (Math.random() - 0.5) * size * 0.6,
    r: size * (0.1 + Math.random() * 0.15)
  });
  return out;
}

function circHit(x1, y1, r1, x2, y2, r2) {
  const dx = x1 - x2, dy = y1 - y2;
  return dx * dx + dy * dy < (r1 + r2) * (r1 + r2);
}

function spawnBurst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2;
    const s = 1 + Math.random() * 4;
    game.particles.push({
      x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
      life: 0.6 + Math.random() * 0.4, color, r: 1 + Math.random() * 2.5
    });
  }
}

function gameOver() {
  if (!game.running) return;
  game.running = false;
  Sound.stopEngine();
  const finalScore = game.score;
  showGameOver(finalScore);
}

function render() {
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#0a0e27'); 
  grad.addColorStop(0.5, '#131a3f'); 
  grad.addColorStop(1, '#0a0e27');
  ctx.fillStyle = grad; 
  ctx.fillRect(0, 0, W, H);

  const neb = ctx.createRadialGradient(W * 0.2, H * 0.3, 0, W * 0.2, H * 0.3, W * 0.6);
  neb.addColorStop(0, 'rgba(107, 156, 255, 0.08)'); 
  neb.addColorStop(1, 'rgba(107, 156, 255, 0)');
  ctx.fillStyle = neb; 
  ctx.fillRect(0, 0, W, H);

  game.stars.forEach(s => {
    const flicker = 0.5 + 0.5 * Math.sin(s.tw);
    ctx.fillStyle = `rgba(${220 + s.layer * 10}, ${230 + s.layer * 5}, 255, ${0.3 + flicker * 0.5})`;
    ctx.beginPath(); 
    ctx.arc(s.x, s.y, s.r * s.layer, 0, Math.PI * 2); 
    ctx.fill();
  });

  game.collectibles.forEach(c => drawStar(c.x, c.y, c.r + Math.sin(c.pulse) * 2, c.rot, '#ffd700', '#ff9500'));
  game.powerups.forEach(p => drawPowerup(p));
  game.meteors.forEach(m => drawMeteor1(m));

  game.bullets.forEach(b => {
    ctx.fillStyle = '#00ffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 15;
    ctx.beginPath(); 
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); 
    ctx.fill();
    
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#00ffff';
    ctx.shadowBlur = 8;
    ctx.beginPath(); 
    ctx.arc(b.x, b.y, b.r * 0.5, 0, Math.PI * 2); 
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  game.particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life); 
    ctx.fillStyle = p.color;
    ctx.beginPath(); 
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); 
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  drawRocket(game.rocket);

  if (game.shieldTime > 0) {
    const r = game.rocket;
    const alpha = 0.5 + 0.3 * Math.sin(game.shieldRing * 2);
    const radius = 40 + Math.sin(game.shieldRing) * 3;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.strokeStyle = '#4af2ff'; 
    ctx.lineWidth = 2;
    ctx.shadowColor = '#4af2ff'; 
    ctx.shadowBlur = 15;
    ctx.beginPath(); 
    ctx.arc(r.x, r.y, radius, 0, Math.PI * 2); 
    ctx.stroke();
    ctx.globalAlpha = alpha * 0.3; 
    ctx.fillStyle = '#4af2ff'; 
    ctx.fill();
    ctx.restore();
  }
  
  // Рисуем сердечки жизней в правом углу
  const heartSize = 20;
  const heartX = W - heartSize - 15;
  let heartY = 20;
  for (let i = 0; i < game.maxLives; i++) {
    const opacity = i < game.lives ? 1 : 0.3;
    ctx.globalAlpha = opacity;
    drawHeartSmall(heartX - i * (heartSize + 8), heartY, heartSize);
  }
  ctx.globalAlpha = 1;
  
  // Рисуем таймер
  const elapsed = Date.now() - game.gameStartTime;
  const remaining = Math.max(0, game.maxDuration - elapsed);
  const seconds = Math.ceil(remaining / 1000);
  const minutes = Math.floor(seconds / 60);
  const secs = seconds % 60;
  
  ctx.fillStyle = remaining < 30000 ? '#ff6b6b' : '#4af2ff';
  ctx.font = 'bold 16px Arial';
  ctx.textAlign = 'left';
  ctx.fillText(`⏱️ ${minutes}:${secs.toString().padStart(2, '0')}`, 20, heartY + 35);
}

function drawHeartSmall(x, y, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.fillStyle = '#ff3333';
  ctx.shadowColor = '#ff3333';
  ctx.shadowBlur = 8;
  
  const r = size * 0.5;
  ctx.beginPath();
  ctx.arc(-r * 0.5, -r * 0.3, r * 0.4, 0, Math.PI * 2);
  ctx.arc(r * 0.5, -r * 0.3, r * 0.4, 0, Math.PI * 2);
  ctx.moveTo(-r * 0.8, -r * 0.1);
  ctx.quadraticCurveTo(0, r * 0.7, 0, r * 0.7);
  ctx.quadraticCurveTo(0, r * 0.7, r * 0.8, -r * 0.1);
  ctx.closePath();
  ctx.fill();
  
  ctx.shadowBlur = 0;
  ctx.restore();
}

function drawStar(x, y, r, rot, fill, stroke) {
  ctx.save(); 
  ctx.translate(x, y); 
  ctx.rotate(rot);
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const angle = (i / 10) * Math.PI * 2 - Math.PI / 2;
    const rad = i % 2 === 0 ? r : r * 0.45;
    ctx.lineTo(Math.cos(angle) * rad, Math.sin(angle) * rad);
  }
  ctx.closePath();
  ctx.shadowColor = fill; 
  ctx.shadowBlur = 15;
  ctx.fillStyle = fill; 
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.strokeStyle = stroke; 
  ctx.lineWidth = 1.5; 
  ctx.stroke();
  ctx.restore();
}

function drawMeteor1(m) {
  ctx.save(); 
  ctx.translate(m.x, m.y); 
  ctx.rotate(m.rot);
  
  const g = ctx.createRadialGradient(-m.r * 0.2, -m.r * 0.2, 0, 0, 0, m.r);
  g.addColorStop(0, '#d4d0cc');
  g.addColorStop(0.5, '#a8a3a0');
  g.addColorStop(1, '#7a7571');
  ctx.fillStyle = g;
  ctx.beginPath(); 
  ctx.arc(0, 0, m.r, 0, Math.PI * 2); 
  ctx.fill();
  
  ctx.strokeStyle = '#8b8682'; 
  ctx.lineWidth = 1.5;
  ctx.beginPath(); 
  ctx.arc(0, 0, m.r, 0, Math.PI * 2); 
  ctx.stroke();
  
  m.craters.forEach(c => {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.beginPath(); 
    ctx.arc(c.ox, c.oy, c.r, 0, Math.PI * 2); 
    ctx.fill();
  });
  
  ctx.restore();
}

function drawPowerup(p) {
  ctx.save(); 
  ctx.translate(p.x, p.y);
  const scale = 1 + Math.sin(p.pulse) * 0.1;
  ctx.scale(scale, scale); 
  ctx.rotate(p.rot);
  
  if (p.type === 'shield') {
    ctx.shadowColor = '#4af2ff'; 
    ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(74, 242, 255, 0.3)';
    ctx.strokeStyle = '#4af2ff'; 
    ctx.lineWidth = 2;
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i / 6) * Math.PI * 2;
      const x = Math.cos(a) * p.r; 
      const y = Math.sin(a) * p.r;
      if (i === 0) ctx.moveTo(x, y); 
      else ctx.lineTo(x, y);
    }
    ctx.closePath(); 
    ctx.fill(); 
    ctx.stroke();
    ctx.shadowBlur = 0; 
    ctx.fillStyle = '#4af2ff';
    ctx.beginPath();
    ctx.moveTo(0, -p.r * 0.5);
    ctx.lineTo(p.r * 0.4, -p.r * 0.2);
    ctx.lineTo(p.r * 0.4, p.r * 0.2);
    ctx.lineTo(0, p.r * 0.5);
    ctx.lineTo(-p.r * 0.4, p.r * 0.2);
    ctx.lineTo(-p.r * 0.4, -p.r * 0.2);
    ctx.closePath(); 
    ctx.fill();
  } else if (p.type === 'life') {
    ctx.shadowColor = '#ff3333'; 
    ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(255, 51, 51, 0.3)';
    ctx.strokeStyle = '#ff3333'; 
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    const x = 0, y = 0, r = p.r;
    ctx.arc(x - r * 0.5, y - r * 0.3, r * 0.5, 0, Math.PI * 2);
    ctx.arc(x + r * 0.5, y - r * 0.3, r * 0.5, 0, Math.PI * 2);
    ctx.moveTo(x - r * 0.95, y - r * 0.15);
    ctx.quadraticCurveTo(x, y + r * 0.85, x, y + r * 0.85);
    ctx.quadraticCurveTo(x, y + r * 0.85, x + r * 0.95, y - r * 0.15);
    ctx.closePath();
    ctx.fill(); 
    ctx.stroke();
    ctx.shadowBlur = 0; 
    ctx.fillStyle = '#ff3333';
    ctx.fill();
  } else {
    ctx.shadowColor = '#00ffff'; 
    ctx.shadowBlur = 20;
    ctx.fillStyle = 'rgba(0, 255, 255, 0.3)';
    ctx.strokeStyle = '#00ffff'; 
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -p.r); 
    ctx.lineTo(p.r, 0);
    ctx.lineTo(0, p.r); 
    ctx.lineTo(-p.r, 0); 
    ctx.closePath();
    ctx.fill(); 
    ctx.stroke();
    ctx.shadowBlur = 0; 
    ctx.fillStyle = '#00ffff';
    ctx.beginPath();
    ctx.moveTo(-p.r * 0.15, -p.r * 0.5);
    ctx.lineTo(p.r * 0.25, -p.r * 0.05);
    ctx.lineTo(0, 0);
    ctx.lineTo(p.r * 0.15, p.r * 0.5);
    ctx.lineTo(-p.r * 0.25, p.r * 0.05);
    ctx.lineTo(0, 0); 
    ctx.closePath(); 
    ctx.fill();
  }
  ctx.restore();
}

function drawRocket(r) {
  ctx.save(); 
  ctx.translate(r.x, r.y); 
  ctx.rotate(r.tilt);
  
  const flameH = 22 + Math.sin(r.flameT) * 6;
  const flameW = 10;
  const rocketHeight = 56;
  const rocketWidth = 36;
  
  const fg = ctx.createLinearGradient(0, rocketHeight / 2, 0, rocketHeight / 2 + flameH);
  fg.addColorStop(0, '#fff8c0'); 
  fg.addColorStop(0.4, '#ff9500'); 
  fg.addColorStop(1, 'rgba(255, 60, 0, 0)');
  ctx.fillStyle = fg;
  ctx.beginPath();
  ctx.moveTo(-flameW, rocketHeight / 2 - 2);
  ctx.quadraticCurveTo(0, rocketHeight / 2 + flameH * 1.4, flameW, rocketHeight / 2 - 2);
  ctx.closePath(); 
  ctx.fill();

  const fg2 = ctx.createLinearGradient(0, rocketHeight / 2, 0, rocketHeight / 2 + flameH * 0.6);
  fg2.addColorStop(0, '#ffffff'); 
  fg2.addColorStop(1, 'rgba(255, 255, 200, 0)');
  ctx.fillStyle = fg2;
  ctx.beginPath();
  ctx.moveTo(-flameW * 0.5, rocketHeight / 2 - 2);
  ctx.quadraticCurveTo(0, rocketHeight / 2 + flameH * 0.8, flameW * 0.5, rocketHeight / 2 - 2);
  ctx.closePath(); 
  ctx.fill();

  ctx.shadowColor = '#4af2ff'; 
  ctx.shadowBlur = 20;

  ctx.fillStyle = '#2a5aa8';
  ctx.beginPath();
  ctx.moveTo(-rocketWidth / 2, rocketHeight / 2);
  ctx.lineTo(-rocketWidth / 2 - 8, rocketHeight / 2 + 4);
  ctx.lineTo(-rocketWidth / 2, rocketHeight / 2 - 14);
  ctx.closePath(); 
  ctx.fill();
  
  ctx.beginPath();
  ctx.moveTo(rocketWidth / 2, rocketHeight / 2);
  ctx.lineTo(rocketWidth / 2 + 8, rocketHeight / 2 + 4);
  ctx.lineTo(rocketWidth / 2, rocketHeight / 2 - 14);
  ctx.closePath(); 
  ctx.fill();

  const bg = ctx.createLinearGradient(-rocketWidth / 2, 0, rocketWidth / 2, 0);
  bg.addColorStop(0, '#2a5aa8'); 
  bg.addColorStop(0.5, '#6b9cff'); 
  bg.addColorStop(1, '#2a5aa8');
  ctx.fillStyle = bg;
  ctx.beginPath();
  ctx.moveTo(0, -rocketHeight / 2);
  ctx.quadraticCurveTo(rocketWidth / 2, -rocketHeight / 4, rocketWidth / 2, rocketHeight / 4);
  ctx.lineTo(rocketWidth / 2, rocketHeight / 2);
  ctx.lineTo(-rocketWidth / 2, rocketHeight / 2);
  ctx.lineTo(-rocketWidth / 2, rocketHeight / 4);
  ctx.quadraticCurveTo(-rocketWidth / 2, -rocketHeight / 4, 0, -rocketHeight / 2);
  ctx.closePath(); 
  ctx.fill();

  ctx.shadowBlur = 0;

  ctx.fillStyle = '#4af2ff';
  ctx.beginPath();
  ctx.moveTo(0, -rocketHeight / 2);
  ctx.quadraticCurveTo(rocketWidth / 3, -rocketHeight / 4, rocketWidth / 3, 0);
  ctx.lineTo(-rocketWidth / 3, 0);
  ctx.quadraticCurveTo(-rocketWidth / 3, -rocketHeight / 4, 0, -rocketHeight / 2);
  ctx.closePath(); 
  ctx.fill();

  ctx.fillStyle = '#0a0e27';
  ctx.beginPath(); 
  ctx.arc(0, -2, 7, 0, Math.PI * 2); 
  ctx.fill();
  
  ctx.fillStyle = 'rgba(74, 242, 255, 0.7)';
  ctx.beginPath(); 
  ctx.arc(-2, -4, 3, 0, Math.PI * 2); 
  ctx.fill();

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-rocketWidth / 2 + 2, 10, rocketWidth - 4, 3);
  
  ctx.restore();
}

// Boot sequence
window.addEventListener('load', () => {
  setTimeout(() => {
    showMenu();
  }, 1500);
});

document.addEventListener('touchmove', e => {
  if (game && game.running) e.preventDefault();
}, { passive: false });
